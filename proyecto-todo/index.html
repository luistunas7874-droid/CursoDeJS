<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <div class="encabezado">
            <h1>📝 Mi Lista de Tareas</h1>
            <button id="btn-tema">🌙</button>
        </div>

        <form id="form-tarea">

            <input
                type="text"
                id="input-tarea"
                placeholder="¿Qué necesitas hacer?"
                required
            >

            <select id="categoria-tarea">
                <option value="escuela">🎓 Escuela</option>
                <option value="trabajo">💼 Trabajo</option>
                <option value="personal">👤 Personal</option>
                <option value="otros">📌 Otros</option>
            </select>

            <input
                type="date"
                id="fecha-tarea"
            >

            <button type="submit">Agregar</button>

        </form>

        <div class="filtros">
            <button class="filtro activo" data-filtro="todas">Todas</button>
            <button class="filtro" data-filtro="pendientes">Pendientes</button>
            <button class="filtro" data-filtro="completadas">Completadas</button>
        </div>

        <ul id="lista-tareas">
        </ul>

        <p class="contador">
            <span id="contador-pendientes">0</span> tareas pendientes
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
